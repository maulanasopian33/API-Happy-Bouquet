name: Deploy to Shared Hosting

on:
  push:
    tags:
      - "v*" # Trigger on version tags, e.g., v1.0.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Use a stable Node version

      # Install dependencies (Clean Install)
      - name: Install dependencies
        run: npm ci

      # Build Project (TypeScript -> JavaScript in /dist)
      - name: Build Project
        run: npm run build

      # Remove devDependencies to keep node_modules production-ready (uploaded via rsync)
      - name: Prune dev dependencies
        run: npm prune --production

      # Prepare deploy dir (dist + node_modules produksi + config)
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp -r dist deploy/dist
          cp -r node_modules deploy/node_modules
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json

          # Migration files
          cp -r migrations deploy/migrations
          if [ -d "seeders" ]; then
            cp -r seeders deploy/seeders
          else
            echo "Seeders directory not found, skipping."
          fi

          # Use Production .sequelizerc (points to dist/)
          cp .sequelizerc.prod deploy/.sequelizerc

          # Restart trigger for Passenger (cPanel Node.js app)
          mkdir -p deploy/tmp
          echo "restart $(date -u +%FT%TZ)" > deploy/tmp/restart.txt

          echo "Deploy folder size:"
          du -sh deploy
          echo "Node modules size:"
          du -sh deploy/node_modules

      # Deploy via SSH (Rsync incremental) — cPanel SSH Access
      - name: Deploy to Server via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "deploy/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: ${{ secrets.SSH_TARGET_DIR }}
          EXCLUDE: "/.git*"